specVersion: '4.0'
type: library
metadata:
  name: ui5.antares.pro
framework:
  name: SAPUI5
  version: 1.136.3
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.ui.comp
    - name: sap.ui.table
    - name: sap.ui.layout
builder:
  resources:
    excludes:
      - /test-resources/**
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: false
        removeConsoleStatements: true
        transformAsyncToPromise: false
        transformTypeScript: true
        generateDts: true
        omitTSFromBuildResult: true
        omitSourceMaps: true
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8